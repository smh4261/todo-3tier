apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: todo-3tier
spec:
  selector:
    app: api
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: todo-3tier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: todo-3tier-api:v3-compose
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/todos
              port: 3000
            periodSeconds: 5
          # DB 장애로 API까지 재시작되지 않도록 liveness는 포트만 확인한다.
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
